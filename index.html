<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SB</title>
  <style>
    :root{ --bg:#050507; --neon1:#ff1630; --neon2:#8b0000; }
    html,body{height:100%;margin:0}
    body{
      background: radial-gradient(1200px 400px at 10% 10%, rgba(139,0,0,0.12), transparent 8%),
                  radial-gradient(800px 300px at 90% 90%, rgba(255,22,48,0.06), transparent 6%),
                  linear-gradient(180deg,#000000 0%, #070607 60%);
      color:#fff; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      display:flex; align-items:center; justify-content:center; overflow:hidden;
    }
    .scene{position:relative; width:min(820px,92vw); height:min(420px,70vh); display:flex; align-items:center; justify-content:center; border-radius:18px; box-shadow: 0 20px 60px rgba(0,0,0,0.8); background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border:1px solid rgba(255,255,255,0.03);}
    .grid { position:absolute; inset:0; background-image: linear-gradient(transparent 94%, rgba(255,255,255,0.02) 96%), linear-gradient(90deg, transparent 94%, rgba(255,255,255,0.02) 96%); background-size: 60px 60px, 60px 60px; opacity:0.06; }
    .sb {
      position:relative; z-index:5; font-weight:900; letter-spacing:0.06em; font-size:110px; line-height:1; text-align:center;
      color:var(--neon1); text-shadow: 0 0 22px rgba(255,22,48,0.28), 0 0 46px rgba(139,0,0,0.14), 0 12px 36px rgba(0,0,0,0.6);
      -webkit-text-stroke: 1px rgba(0,0,0,0.35);
      transform:translateY(-6px);
    }
    .sb::after{ content:''; position:absolute; inset:0; filter:blur(28px); opacity:0.55; background: linear-gradient(90deg, rgba(255,22,48,0.35), rgba(139,0,0,0.25)); mix-blend-mode:screen; border-radius:12px; }
    .subtitle{ position:relative; z-index:6; margin-top:14px; color:#ffd9d9; opacity:0.95; font-size:18px; letter-spacing:0.14em; text-transform:none; }
    .scan{ position:absolute; left:-30%; top: -40%; width:160%; height:260%; transform:rotate(25deg); background: linear-gradient(180deg, rgba(255,255,255,0.00) 0%, rgba(255,255,255,0.03) 48%, rgba(255,255,255,0.00) 100%); opacity:0.06; animation: sweep 6s linear infinite; }
    @keyframes sweep{ from{transform: translateX(-20%) rotate(25deg);} to{transform: translateX(20%) rotate(25deg);} }
    @media (max-width:560px){ .sb{ font-size:64px } .scene{height:300px} .subtitle{font-size:14px} }
  </style>
</head>
<body>
  <div class="scene" role="img" aria-label="Futuristic black and red neon background with SB title">
    <div class="grid" aria-hidden="true"></div>
    <div class="scan" aria-hidden="true"></div>
    <div style="text-align:center;">
      <div class="sb">SB</div>
      <div class="subtitle">suggestion box</div>
    </div>
  </div>
</body>
</html>
